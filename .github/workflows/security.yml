name: Security

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  schedule:
    # Weekly run so newly published vulnerabilities are caught even
    # when the repo is quiet (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: src/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # The "dev" tag pulls in src/dummy_assets.go, which stands in for the
      # bundler-generated Asset/AssetDir/RestoreAssets symbols so the package
      # compiles without running astilectron-bundler first.
      - name: Run govulncheck
        working-directory: ./src
        run: govulncheck -tags dev ./...

  vet:
    name: go vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: src/go.sum

      - name: Run go vet
        working-directory: ./src
        run: go vet -tags dev ./...
